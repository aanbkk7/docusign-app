# Render blueprint — one web service hosts both the Express API and the
# built React frontend (server.js serves frontend/dist as static files).
# https://render.com/docs/blueprint-spec
#
# In the Render dashboard: New -> Blueprint -> pick this repo -> it reads
# this file automatically. Any env var marked `sync: false` has to be typed
# in by hand in the Render dashboard (secrets aren't stored in the repo).

services:
  - type: web
    name: docusign-app
    runtime: node
    plan: free
    buildCommand: >
      cd backend && npm install && npx prisma generate && npx prisma migrate deploy &&
      cd ../frontend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: DATABASE_URL
        sync: false # Postgres connection string (e.g. from neon.tech)
      - key: PUBLIC_APP_URL
        sync: false # the https://xxxx.onrender.com URL Render gives this service
      - key: SENDER_PASSWORD
        sync: false # required — gates the sender dashboard; recipients don't need it
      - key: R2_ACCOUNT_ID
        sync: false # required — Cloudflare R2 (uploaded/signed PDFs are stored here, not on local disk)
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
